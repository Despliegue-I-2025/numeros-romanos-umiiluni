<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertidor de Números Romanos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1a202c;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .header p {
      font-size: 1.125rem;
      opacity: 0.95;
      line-height: 1.5;
    }

    .content {
      padding: 48px;
    }

    .converters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .converter-card {
      background: #f7fafc;
      border-radius: 16px;
      padding: 32px;
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease;
    }

    .converter-card:hover {
      border-color: #667eea;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
      transform: translateY(-2px);
    }

    .converter-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 1.125rem;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 1.125rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    input:disabled {
      background: #edf2f7;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.125rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      border: 2px solid #48bb78;
      font-size: 1.25rem;
      font-weight: 600;
      color: #22543d;
      text-align: center;
      animation: slideIn 0.3s ease-out;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result.error {
      border-color: #f56565;
      color: #742a2a;
      background: #fff5f5;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .examples {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      border: 2px dashed #cbd5e0;
    }

    .examples-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .example-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .example-tag {
      padding: 6px 12px;
      background: #edf2f7;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .example-tag:hover {
      background: #667eea;
      color: white;
      transform: translateY(-1px);
    }

    .footer {
      padding: 24px;
      text-align: center;
      background: #f7fafc;
      color: #718096;
      font-size: 0.875rem;
      border-top: 1px solid #e2e8f0;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2rem;
      }

      .content {
        padding: 32px 24px;
      }

      .converter-card {
        padding: 24px;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.75rem;
      }

      .header p {
        font-size: 1rem;
      }

      .content {
        padding: 24px 16px;
      }

      .converter-title {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Convertidor de Números Romanos</h1>
      <p>Convierte entre números romanos (I, V, X, L, C, D, M) y números arábigos (1-3999)</p>
    </div>

    <div class="content">
      <div class="converters">
        <div class="converter-card">
          <h2 class="converter-title">
            <span class="icon">R→A</span>
            Romano a Arábigo
          </h2>
          <form id="romanToArabicForm">
            <div class="input-group">
              <label for="romanInput">Número Romano</label>
              <input
                type="text"
                id="romanInput"
                placeholder="Ej: XIV, MCMXCIV, MMXXIII"
                autocomplete="off"
              >
            </div>
            <button type="submit">Convertir a Arábigo</button>
          </form>
          <div id="romanResult" class="result"></div>
          <div class="examples">
            <div class="examples-title">Ejemplos:</div>
            <div class="example-tags">
              <span class="example-tag" data-target="romanInput">XIV</span>
              <span class="example-tag" data-target="romanInput">XLII</span>
              <span class="example-tag" data-target="romanInput">MCMXCIV</span>
              <span class="example-tag" data-target="romanInput">MMXXIII</span>
            </div>
          </div>
        </div>

        <div class="converter-card">
          <h2 class="converter-title">
            <span class="icon">A→R</span>
            Arábigo a Romano
          </h2>
          <form id="arabicToRomanForm">
            <div class="input-group">
              <label for="arabicInput">Número Arábigo (1-3999)</label>
              <input
                type="number"
                id="arabicInput"
                placeholder="Ej: 14, 1994, 2023"
                min="1"
                max="3999"
                autocomplete="off"
              >
            </div>
            <button type="submit">Convertir a Romano</button>
          </form>
          <div id="arabicResult" class="result"></div>
          <div class="examples">
            <div class="examples-title">Ejemplos:</div>
            <div class="example-tags">
              <span class="example-tag" data-target="arabicInput">14</span>
              <span class="example-tag" data-target="arabicInput">42</span>
              <span class="example-tag" data-target="arabicInput">1994</span>
              <span class="example-tag" data-target="arabicInput">2023</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      Convertidor de Números Romanos - Soporta valores del 1 al 3999
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
